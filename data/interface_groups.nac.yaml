iosxe:
  interface_groups:
    - name: fabric
      configuration:
        switchport:
          enable: false
        ipv4:
          unnumbered_interface_type: Loopback
          unnumbered_interface_id: 0
        ospf:
          process_ids:
            - id: 1
              areas: ["0"]
          network_type: point-to-point
        pim:
          sparse_mode: true

    - name: loopback
      configuration:
        ospf:
          process_ids:
            - id: 1
              areas: ["0"]
          network_type: point-to-point
        pim:
          sparse_mode: true

iosxe:
  global:
    variables:
      bgp_asn: 65000
      anycast_ip: 10.1.101.1

  device_groups:
    - name: LEAFS
      templates: [global, underlay_fabric, underlay_leaf]
    - name: SPINES
      templates: [global, underlay_fabric, underlay_spine]

  devices:
    - name: LEAF1
      host: 10.1.1.1
      device_groups:
        - LEAFS
      variables:
        hostname: LEAF1
        lo0_ip: 10.1.100.3
        vtep_ip: 10.1.200.1

    - name: LEAF2
      host: 10.1.1.2
      device_groups:
        - LEAFS
      variables:
        hostname: LEAF2
        lo0_ip: 10.1.100.4
        vtep_ip: 10.1.200.2

    - name: SPINE1
      host: 10.1.1.3
      device_groups:
        - SPINES
      variables:
        hostname: SPINE1
        lo0_ip: 10.1.100.1
        msdp_peer_ip: 10.1.100.2

    - name: SPINE2
      host: 10.1.1.4
      device_groups:
        - SPINES
      variables:
        hostname: SPINE2
        lo0_ip: 10.1.100.2
        msdp_peer_ip: 10.1.100.1

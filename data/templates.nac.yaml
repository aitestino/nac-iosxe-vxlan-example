iosxe:
  templates:
    - name: underlay_leaf
      type: file
      file: data/templates/underlay_leaf.yaml.tftpl

    - name: underlay_spine
      type: file
      file: data/templates/underlay_spine.yaml.tftpl

    - name: service_l2
      type: file
      file: data/templates/service_l2.yaml.tftpl

    - name: service_l3
      type: file
      file: data/templates/service_l3.yaml.tftpl

    - name: global
      type: model
      # Variables
      # - hostname: The hostname of the device
      # - lo0_ip: The IP address of the loopback0 interface
      configuration:
        system:
          hostname: ${hostname}
          ip_routing: true
          ipv6_unicast_routing: true
          multicast_routing_switch: true
          mtu: 8978
        interfaces:
          loopbacks:
            - id: 0
              interface_groups: [loopback]
              ipv4:
                address: ${lo0_ip}
                address_mask: 255.255.255.255

    - name: underlay_fabric
      type: model
      # Variables
      # - bgp_asn: The BGP AS number
      # - lo0_ip: The IP address of the loopback0 interface
      # - anycast_ip: The IP address of the anycast IP address
      configuration:
        routing:
          ospf_processes:
            - id: 1
              router_id: ${lo0_ip}
          bgp:
            as_number: ${bgp_asn}
            default_ipv4_unicast: false
            log_neighbor_changes: true
            router_id_interface_type: Loopback
            router_id_interface_id: 0
        pim:
          ssm_default: true
          rp_address: ${anycast_ip}
